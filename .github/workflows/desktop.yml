name: Настольное приложение

# Сборка «Маяка» для Windows, macOS (Apple Silicon и Intel) и Linux.
# Обычный запуск — установщики в артефактах сборки (вкладка Actions).
# Тег desktop-v* или ручной запуск с «Опубликовать релиз» — публичный релиз
# GitHub с установщиками; его ссылки использует страница скачивания.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Опубликовать релиз (тег desktop-v<версия> создаётся автоматически)"
        type: boolean
        default: false
      platforms:
        description: "Для каких систем собрать"
        type: choice
        options:
          - все
          - Windows x64 и Android
        default: все
  push:
    branches: [main, "claude/**"]
    tags: ["desktop-v*"]
    paths:
      - "apps/**"
      - "packages/**"
      - "design/**"
      - "package-lock.json"
      - ".github/workflows/desktop.yml"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Проверки
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Системные библиотеки WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run typecheck
      - name: Модульные тесты (без PostgreSQL серверные тесты пропускаются)
        run: npx vitest run
      - name: Тесты Rust
        working-directory: apps/desktop/src-tauri
        run: cargo test

  window-test:
    name: Окно приложения (Linux, WebDriver)
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Системные библиотеки, WebKitWebDriver и Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb dbus-x11
      - run: npm ci
      - run: cargo install tauri-driver --locked
      - name: Сборка программы без установщиков
        run: npm run tauri -w @mayak/desktop -- build --no-bundle
      - name: Заметка переживает перезапуск и хранится в SQLite
        run: xvfb-run -a dbus-run-session -- sh -c 'tauri-driver & sleep 2; node apps/desktop/e2e/smoke.mjs'

  android:
    name: Сборка · Android
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VITE_API_BASE: ${{ vars.MAYAK_API_BASE }}
      VITE_SUPABASE_URL: ${{ vars.MAYAK_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MAYAK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Только 64-битный ARM: так выпускаются все современные телефоны на Android.
          targets: aarch64-linux-android
      - run: npm ci
      - name: Ключ подписи
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/desktop/src-tauri/gen/android
        run: |
          if [ -n "$KEY_BASE64" ]; then
            echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/mayak.jks"
            PASS="$KEY_PASSWORD"
          else
            # Без секретов — временный ключ: установка работает, но обновление
            # поверх такой версии потребует удалить приложение.
            echo "::warning::Нет секретов ANDROID_KEY_BASE64 и ANDROID_KEY_PASSWORD — APK подписан временным ключом."
            PASS=$(openssl rand -hex 16)
            keytool -genkey -noprompt -keystore "$RUNNER_TEMP/mayak.jks" -keyalg RSA -keysize 2048 -validity 10000 \
              -alias upload -storepass "$PASS" -keypass "$PASS" -dname "CN=Mayak"
          fi
          printf 'keyAlias=upload\npassword=%s\nstoreFile=%s\n' "$PASS" "$RUNNER_TEMP/mayak.jks" > keystore.properties
      - name: Сборка APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npm run tauri -w @mayak/desktop -- android build --apk --target aarch64
      - name: Файл установщика
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          apk=$(find apps/desktop/src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -1)
          test -n "$apk"
          mkdir -p out && cp "$apk" "out/Mayak_${version}_android.apk"
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
      - name: В релиз
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          gh release upload "desktop-v${version}" out/*.apk --clobber

  build:
    name: Сборка · ${{ matrix.name }}
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # «Windows x64 и Android» в ручном запуске — выпуск только для них
        # (Android собирается отдельным заданием ниже); иначе — все системы.
        include: ${{ fromJSON(inputs.platforms == 'Windows x64 и Android' && '[{"name":"Windows","platform":"windows-latest","args":""}]' || '[{"name":"macOS (Apple Silicon)","platform":"macos-latest","args":"--target aarch64-apple-darwin"},{"name":"macOS (Intel)","platform":"macos-latest","args":"--target x86_64-apple-darwin"},{"name":"Linux","platform":"ubuntu-22.04","args":""},{"name":"Windows","platform":"windows-latest","args":""}]') }}
    runs-on: ${{ matrix.platform }}
    env:
      # Публичные параметры сборки: адрес API и Supabase задаются в
      # Settings → Secrets and variables → Actions → Variables.
      VITE_API_BASE: ${{ vars.MAYAK_API_BASE }}
      VITE_SUPABASE_URL: ${{ vars.MAYAK_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MAYAK_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Системные библиотеки (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          tagName: ${{ (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release) && 'desktop-v__VERSION__' || '' }}
          releaseName: ${{ (startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release) && 'Маяк __VERSION__' || '' }}
          releaseBody: ${{ inputs.platforms == 'Windows x64 и Android' && 'Установщики «Маяка» для Windows (x64) и Android. Для macOS и Linux — предыдущий выпуск.' || 'Установщики «Маяка» для Windows, macOS, Linux и Android.' }}
          releaseDraft: false
