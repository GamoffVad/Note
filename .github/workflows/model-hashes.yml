name: Контрольные суммы моделей Whisper

# Считает SHA-256 моделей распознавания речи и сверяет SHA-1 с опубликованными
# в whisper.cpp (models/README.md). Результат вписывается в приложение.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/model-hashes.yml"]

jobs:
  hashes:
    runs-on: ubuntu-22.04
    steps:
      - name: Скачать и посчитать
        run: |
          declare -A SHA1=([tiny]=bd577a113a864445d4c299885e0cb97d4ba92b5f [small]=55356645c2b361a969dfd0ef2c5a50d530afd8d5)
          for m in tiny small; do
            curl -sSfL -o "ggml-$m.bin" "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$m.bin"
            s1=$(sha1sum "ggml-$m.bin" | cut -d' ' -f1)
            s256=$(sha256sum "ggml-$m.bin" | cut -d' ' -f1)
            size=$(stat -c %s "ggml-$m.bin")
            echo "MODEL $m size=$size sha1=$s1 sha256=$s256"
            test "$s1" = "${SHA1[$m]}"
          done
