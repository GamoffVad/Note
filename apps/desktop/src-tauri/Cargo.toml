[package]
name = "mayak-desktop"
version = "0.1.1"
description = "Маяк — заметки, задачи и файлы на всех устройствах"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
# Имя библиотеки отличается от имени программы: иначе на Windows конфликт имён (документация Tauri).
name = "mayak_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.4"
# SQLite собирается вместе с приложением: не зависит от версии в системе.
rusqlite = { version = "0.40", features = ["bundled"] }
# Вход по ссылке из письма: ссылка io.github.gamoffvad.mayak://… открывает приложение.
tauri-plugin-deep-link = "2.4"

# Системное хранилище секретов: Связка ключей macOS, Диспетчер учётных данных Windows,
# Secret Service в Linux. На мобильных системах — отдельная реализация позже.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "4.2"
# Повторный запуск (в Windows и Linux так приходит ссылка) передаёт её уже открытому окну.
tauri-plugin-single-instance = { version = "2.4", features = ["deep-link"] }

# Диктовка через Wispr Flow: нажатие его сочетания клавиш (wispr.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
